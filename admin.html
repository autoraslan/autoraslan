<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - أوتو رسلان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #131b2e;
            --primary: #d4af37;
            --primary-hover: #e5c158;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(212, 175, 55, 0.2);
            --transition: all 0.4s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        /* شاشة تسجيل الدخول الإداري */
        #loginCard {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 100%; max-width: 420px; padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); text-align: center;
        }
        #loginCard h2 { color: var(--primary); font-size: 1.8rem; margin-bottom: 10px; }
        #loginCard p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; }

        .form-control {
            width: 100%; padding: 14px 18px; margin-bottom: 15px;
            background: var(--bg-dark); border: 1px solid var(--border-color);
            border-radius: 10px; color: var(--text-main); font-size: 1rem; outline: none;
            transition: var(--transition);
        }
        .form-control:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; background: linear-gradient(135deg, var(--primary), #b38f20);
            color: var(--bg-dark); border: none; padding: 14px; border-radius: 10px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: var(--transition);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-main:hover { background: linear-gradient(135deg, var(--primary-hover), var(--primary)); transform: translateY(-2px); }

        /* حاوية لوحة التحكم بعد الدخول */
        #adminDashboard {
            display: none; width: 100%; max-width: 900px;
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .admin-header {
            padding: 20px 30px; background: rgba(11, 15, 25, 0.95);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-header h3 { color: var(--primary); font-size: 1.4rem; }

        .admin-body { padding: 30px; max-height: 80vh; overflow-y: auto; }

        .admin-tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn {
            background: var(--bg-dark); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .tab-btn.active { background: var(--primary); color: var(--bg-dark); border-color: var(--primary); }

        .admin-section { display: none; }
        .admin-section.active { display: block; }

        .file-upload-box {
            border: 2px dashed var(--border-color); padding: 25px; text-align: center;
            border-radius: 10px; cursor: pointer; margin-bottom: 15px; background: rgba(11, 15, 25, 0.4);
            transition: var(--transition);
        }
        .file-upload-box:hover { border-color: var(--primary); }

        .admin-list-item {
            background: rgba(11, 15, 25, 0.6); padding: 15px; border-radius: 10px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .btn-danger {
            background: #e74c3c; color: white; border: none; padding: 6px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-danger:hover { background: #c0392b; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginCard">
        <div style="font-size: 3rem; color: var(--primary); margin-bottom: 15px;">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h2>بوابة الإدارة السرية</h2>
        <p>أدخل الرقم الوظيفي والرقم السري للوصول للوحة تحكم أوتو رسلان</p>
        <input type="text" id="empId" class="form-control" placeholder="الرقم الوظيفي (مثال: 7001)">
        <input type="password" id="empPass" class="form-control" placeholder="الرقم السري (مثال: raslan2026)">
        <button class="btn-main" onclick="loginAdmin()">تسجيل الدخول</button>
    </div>

    <!-- لوحة التحكم الإدارية (تظهر بعد الدخول الصحيح) -->
    <div id="adminDashboard">
        <div class="admin-header">
            <h3><i class="fa-solid fa-sliders"></i> لوحة التحكم - أوتو رسلان</h3>
            <button onclick="logoutAdmin()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;">
                <i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج
            </button>
        </div>
        <div class="admin-body">
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchTab('addCar', this)">إضافة سيارة جديدة</button>
                <button class="tab-btn" onclick="switchTab('manageCars', this)">إدارة المعرض والسيارات</button>
                <button class="tab-btn" onclick="switchTab('manageBookings', this)">طلبات العملاء والاستفسارات</button>
            </div>

            <!-- تبويب إضافة سيارة بالمواصفات المطورة -->
            <div id="addCar" class="admin-section active">
                <h4 style="margin-bottom: 15px; color: var(--primary);">إضافة سيارة جديدة للمخزون</h4>
                
                <label style="font-size: 0.9rem; color: var(--text-muted);">شركة التصنيع:</label>
                <select id="carCompanySelect" class="form-control" onchange="updateModelsList()">
                    <option value="">اختر الشركة المصنعة...</option>
                </select>

                <label style="font-size: 0.9rem; color: var(--text-muted);">اسم السيارة (الموديل):</label>
                <select id="carModelSelect" class="form-control" onchange="updateTrimsList()">
                    <option value="">اختر الشركة أولاً...</option>
                </select>

                <label style="font-size: 0.9rem; color: var(--text-muted);">الفئة:</label>
                <select id="carTrimSelect" class="form-control">
                    <option value="">اختر الموديل أولاً...</option>
                </select>

                <label style="font-size: 0.9rem; color: var(--text-muted);">سنة الصنع:</label>
                <select id="carYearSelect" class="form-control">
                    <!-- تتعبأ تلقائياً من 1980 إلى 2027 -->
                </select>

                <label style="font-size: 0.9rem; color: var(--text-muted);">الممشى (كتابة حرة):</label>
                <input type="text" id="carMileageInput" class="form-control" placeholder="مثال: 20,000 كم أو جديد وكالة">

                <label style="font-size: 0.9rem; color: var(--text-muted);">صور السيارة (اسحب أو اختر من جهازك):</label>
                <div class="file-upload-box" onclick="document.getElementById('carImageFile').click()">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: var(--primary); margin-bottom: 8px; display: block;"></i>
                    <span id="uploadLabel" style="font-size: 0.95rem; color: var(--text-muted);">اضغط لاختيار أو سحب صور السيارة من جهازك</span>
                </div>
                <input type="file" id="carImageFile" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                <input type="hidden" id="carImageBase64">

                <label style="font-size: 0.9rem; color: var(--text-muted);">السعر (بالريال السعودي):</label>
                <input type="text" id="carPriceInput" class="form-control" placeholder="مثال: 125,000 ر.س">

                <button class="btn-main" style="margin-top: 10px;" onclick="addNewCar()">حفظ ونشر السيارة في المعرض</button>
            </div>

            <!-- تبويب إدارة السيارات -->
            <div id="manageCars" class="admin-section">
                <h4 style="margin-bottom: 15px; color: var(--primary);">السيارات المعروضة حالياً</h4>
                <div id="adminCarsList"></div>
            </div>

            <!-- تبويب طلبات العملاء -->
            <div id="manageBookings" class="admin-section">
                <h4 style="margin-bottom: 15px; color: var(--primary);">استفسارات وحجوزات العملاء</h4>
                <div id="adminBookingsList"></div>
            </div>
        </div>
    </div>

    <script>
        // قاعدة بيانات الشركات الشاملة (أكثر من 100 شركة عالمية وكورية ويابانية وغيرها)
        const carDatabase = {
            "هيونداي (Hyundai)": { "سوناتا": ["Smart", "Modern", "Premium", "N-Line"], "النترا": ["Smart", "Comfort", "Luxury"], "سانتافي": ["Smart", "Tech", "Calligraphy"], "توسان": ["Smart", "Comfort", "Limited"], "باليسايد": ["Exclusive", "Prestige"], "ازيرا": ["Luxury", "VIP"] },
            "كيا (Kia)": { "سورينتو": ["LX", "EX", "SX", "Signature"], "كارنيفال": ["LX", "EX", "SX Prestige"], "كي 5": ["LX", "EX", "GT-Line"], "سبورتاج": ["LX", "EX", "SX"], "تيلورايد": ["LX", "S", "SX"] },
            "جينيسيس (Genesis)": { "G70": ["Standard", "Sport"], "G80": ["Luxury", "Signature"], "G90": ["Prestige"], "GV70": ["Advanced"], "GV80": ["Signature"] },
            "تويوتا (Toyota)": { "لاندكروزر": ["GXR", "VXR", "GR-Sport"], "كامري": ["LE", "GLE", "SE"], "افالون": ["XLE", "Limited"], "راف فور": ["LE", "Limited"] },
            "لكسوس (Lexus)": { "LX 600": ["Elite", "VIP", "F-Sport"], "ES 350": ["Elegant", "F-Sport"], "RX 350": ["Premier"] },
            "فورد (Ford)": { "تورس": ["Ambient", "Titanium"], "اكسبلورر": ["XLT", "ST"], "مستنج": ["EcoBoost", "GT"] },
            "مرسيدس-بنز (Mercedes-Benz)": { "الفئة S": ["S500", "Maybach"], "الفئة E": ["E200", "AMG E53"], "G-Class": ["G63 AMG"] }
        };

        const extraCompanies = [
            "هوندا (Honda)", "نيسان (Nissan)", "مازدا (Mazda)", "ميتسوبيشي (Mitsubishi)", "سوبارو (Subaru)", 
            "جي إم سي (GMC)", "دودج (Dodge)", "كاديلاك (Cadillac)", "لينكون (Lincoln)", "أودي (Audi)", 
            "بورش (Porsche)", "رينج روفر (Range Rover)", "جاكوار (Jaguar)", "بنتلي (Bentley)", "رولز رويس (Rolls-Royce)",
            "شانجان (Changan)", "جيلي (Geely)", "هافال (Haval)", "بي واي دي (BYD)", "شيري (Chery)", "إم جي (MG)"
        ];

        function initCompanies() {
            const select = document.getElementById('carCompanySelect');
            select.innerHTML = '<option value="">اختر الشركة المصنعة...</option>';
            
            const allComps = Array.from(new Set([...Object.keys(carDatabase), ...extraCompanies]));
            allComps.sort().forEach(comp => {
                select.innerHTML += `<option value="${comp}">${comp}</option>`;
            });
        }

        function updateModelsList() {
            const comp = document.getElementById('carCompanySelect').value;
            const modelSelect = document.getElementById('carModelSelect');
            const trimSelect = document.getElementById('carTrimSelect');

            modelSelect.innerHTML = '<option value="">اختر اسم السيارة...</option>';
            trimSelect.innerHTML = '<option value="">اختر الموديل أولاً...</option>';

            if (carDatabase[comp]) {
                Object.keys(carDatabase[comp]).forEach(model => {
                    modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                });
            } else {
                ["سيدان أساسي", "دفع رباعي فاخر", "فل كامل", "رياضي"].forEach(m => {
                    modelSelect.innerHTML += `<option value="${m}">${m}</option>`;
                });
            }
        }

        function updateTrimsList() {
            const comp = document.getElementById('carCompanySelect').value;
            const model = document.getElementById('carModelSelect').value;
            const trimSelect = document.getElementById('carTrimSelect');

            trimSelect.innerHTML = '<option value="">اختر الفئة...</option>';

            if (carDatabase[comp] && carDatabase[comp][model]) {
                carDatabase[comp][model].forEach(trim => {
                    trimSelect.innerHTML += `<option value="${trim}">${trim}</option>`;
                });
            } else {
                ["ستاندرد (Standard)", "نصف فل (Mid Option)", "فل كامل (Full Option)"].forEach(t => {
                    trimSelect.innerHTML += `<option value="${t}">${t}</option>`;
                });
            }
        }

        function initYears() {
            const yearSelect = document.getElementById('carYearSelect');
            yearSelect.innerHTML = '';
            for (let y = 2027; y >= 1980; y--) {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            }
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('carImageBase64').value = event.target.result;
                    document.getElementById('uploadLabel').innerText = `تم اختيار الصورة بنجاح: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        }

        // تسجيل الدخول بالرقم الوظيفي والرقم السري
        function loginAdmin() {
            const id = document.getElementById('empId').value;
            const pass = document.getElementById('empPass').value;

            // بيانات الاعتماد الوظيفية
            if (id === "7001" && pass === "raslan2026") {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                initCompanies();
                initYears();
                renderAdminCars();
                renderBookings();
            } else {
                alert('الرقم الوظيفي أو الرقم السري غير صحيح!');
            }
        }

        function logoutAdmin() {
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function addNewCar() {
            const comp = document.getElementById('carCompanySelect').value;
            const model = document.getElementById('carModelSelect').value;
            const trim = document.getElementById('carTrimSelect').value;
            const year = document.getElementById('carYearSelect').value;
            const mileage = document.getElementById('carMileageInput').value;
            const price = document.getElementById('carPriceInput').value;
            const imgBase64 = document.getElementById('carImageBase64').value;

            if (!comp || !model || !price) {
                alert('الرجاء اختيار الشركة واسم السيارة وإدخال السعر على الأقل.');
                return;
            }

            const fullName = `${comp} ${model} ${trim ? '- ' + trim : ''} (${year})`;
            const carImage = imgBase64 || 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=80';

            let cars = JSON.parse(localStorage.getItem('raslan_cars')) || [];
            
            const newCarObj = {
                id: Date.now(),
                name: fullName,
                category: 'فاخرة',
                price: price.includes('ر.س') ? price : price + ' ر.س',
                image: carImage,
                year: year,
                mileage: mileage || 'جديد وكالة'
            };

            cars.push(newCarObj);
            localStorage.setItem('raslan_cars', JSON.stringify(cars));

            alert('تمت إضافة السيارة بنجاح ونشرها في المعرض الرئيسي!');
            
            // تصفير الحقول
            document.getElementById('carPriceInput').value = '';
            document.getElementById('carMileageInput').value = '';
            document.getElementById('carImageBase64').value = '';
            document.getElementById('uploadLabel').innerText = 'اضغط لاختيار أو سحب صور السيارة من جهازك';
            renderAdminCars();
        }

        function renderAdminCars() {
            let cars = JSON.parse(localStorage.getItem('raslan_cars')) || [];
            const list = document.getElementById('adminCarsList');
            if (cars.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد سيارات مضافة حالياً.</p>`;
                return;
            }
            list.innerHTML = '';
            cars.forEach(car => {
                list.innerHTML += `
                    <div class="admin-list-item">
                        <span><strong>${car.name}</strong> - ${car.price}</span>
                        <button class="btn-danger" onclick="deleteCar(${car.id})">حذف</button>
                    </div>
                `;
            });
        }

        function deleteCar(id) {
            let cars = JSON.parse(localStorage.getItem('raslan_cars')) || [];
            cars = cars.filter(c => c.id !== id);
            localStorage.setItem('raslan_cars', JSON.stringify(cars));
            renderAdminCars();
        }

        function renderBookings() {
            let bookings = JSON.parse(localStorage.getItem('raslan_bookings')) || [];
            const list = document.getElementById('adminBookingsList');
            if (bookings.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">لا توجد استفسارات أو طلبات جديدة حتى الآن.</p>`;
                return;
            }
            list.innerHTML = '';
            bookings.forEach(b => {
                list.innerHTML += `
                    <div class="admin-list-item" style="flex-direction: column; align-items: flex-start; gap: 5px;">
                        <strong>السيارة: ${b.car}</strong>
                        <span>العميل: ${b.name} | الجوال: <a href="tel:${b.phone}" style="color: var(--primary);">${b.phone}</a></span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">التاريخ: ${b.date}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
